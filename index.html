<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Church Songbook</title>
    <style>
        :root {
            --primary: #4a6572;
            --secondary: #f9aa33;
            --light: #f5f5f5;
            --dark: #232f34;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui;
            background-color: var(--light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            padding: 3rem 0;
            background: var(--dark);
            color: white;
            margin-bottom: 2rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 20px;
            background: var(--secondary);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .song-card {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .song-card:hover {
            transform: translateY(-5px);
        }

        .song-title {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .song-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .song-preview {
            color: #444;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .song-lyrics {
            white-space: pre-line;
            font-size: 1.1rem;
        }

        .chord {
            color: var(--secondary);
            font-weight: bold;
            margin-right: 0.3rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .song-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Church Songbook</h1>
        <p>A Collection of Worship Songs and Hymns</p>
    </header>
 

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="hymn">Hymns</button>
            <button class="filter-btn" data-filter="worship">Worship</button>
            <button class="filter-btn" data-filter="seasonal">Seasonal</button>
        </div>

        <div class="song-grid" id="songGrid"></div>
    </div>

    <div class="modal" id="songModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 class="song-title" id="modalTitle"></h2>
            <div class="song-meta" id="modalMeta"></div>
            <div class="song-lyrics" id="modalLyrics"></div>
        </div>
    </div>

    <script>
       
        // Load song data from external file
        fetch('songs.json')
            .then(response => response.json())
            .then(songs => {
                const container = document.getElementById('songbook');
                
                songs.forEach(song => {
                    const songDiv = document.createElement('div');
                    songDiv.className = 'song';
                    songDiv.innerHTML = `
                        <h2>${song.title}</h2>
                        <p class="author">${song.author}</p>
                        <div class="lyrics">${formatLyrics(song.lyrics)}</div>
                    `;
                    container.appendChild(songDiv);
                });
            });

        function formatLyrics(lyrics) {
            return lyrics.replace(/\[(.*?)\]/g, '<span class="chord">$1</span>')
                        .replace(/\n/g, '<br>');
        }
   

        // Initialize App
        function init() {
            renderSongs(songs);
            setupFilters();
        }

        // Render Songs Grid
        function renderSongs(songsArray) {
            const grid = document.getElementById('songGrid');
            grid.innerHTML = '';
            
            songsArray.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <h3 class="song-title">${song.title}</h3>
                    <div class="song-meta">${song.author} • ${song.category.toUpperCase()}</div>
                    <div class="song-preview">${formatPreview(song.lyrics)}</div>
                `;
                card.addEventListener('click', () => showModal(song));
                grid.appendChild(card);
            });
        }

        // Format Lyrics Preview
        function formatPreview(lyrics) {
            return lyrics.split('\n')
                .slice(0, 3)
                .map(line => line.replace(/\[.*?\]/g, ''))
                .join('\n');
        }

        // Show Song Modal
        function showModal(song) {
            const modal = document.getElementById('songModal');
            document.getElementById('modalTitle').textContent = song.title;
            document.getElementById('modalMeta').textContent = `${song.author} • ${song.category}`;
            document.getElementById('modalLyrics').innerHTML = formatLyrics(song.lyrics);
            modal.style.display = 'block';
        }

        // Close Modal
        function closeModal() {
            document.getElementById('songModal').style.display = 'none';
        }

        // Format Full Lyrics with Chords
        function formatLyrics(lyrics) {
            return lyrics.split('\n')
                .map(line => line.replace(/\[(.*?)\]/g, '<span class="chord">$1</span>'))
                .join('<br>');
        }

        // Filter Setup
        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const filter = btn.dataset.filter;
                    const filtered = filter === 'all' 
                        ? songs 
                        : songs.filter(song => song.category === filter);
                    renderSongs(filtered);
                });
            });
        }

        // Start the app
        init();

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('songModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
